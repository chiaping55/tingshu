plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.8.0'
}

group 'com.github.eprendre.customsources'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
//    maven {
//        url 'https://maven.aliyun.com/repository/public'
//    }
}

dependencies {
    compileOnly fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'com.github.kittinunf.fuel:fuel-json:2.3.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    implementation group: 'org.json', name: 'json', version: '20140107'
    implementation 'org.jsoup:jsoup:1.13.1'
    testImplementation 'junit:junit:4.13'
    testImplementation 'com.willowtreeapps.assertk:assertk-jvm:0.16'
}

// 舊版 d8 只認 Java 8 bytecode，jvmTarget 固定 1.8；用 JDK 17 執行 gradle 即可
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

jar {
    from sourceSets.main.output
    include "com/github/eprendre/${MY_SOURCES_PACKAGE}/**"
//    exclude('com/github/eprendre/tingshu/**')
}

tasks.register('dexTask') {
    doLast {
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            exec {
                workingDir "${buildDir}/libs/"
                commandLine 'cmd', '/c', "${projectDir}/../dx_win/d8.bat --output ${MY_SOURCES_PACKAGE}.jar CustomSources-1.0-SNAPSHOT.jar"
            }
            exec {
                workingDir "${buildDir}/libs/"
                commandLine 'cmd', '/c', """
(
echo @echo off
echo set APK_DIR=/sdcard/Android/data/com.github.eprendre.tingshu/files/jars
echo set FILE=${MY_SOURCES_PACKAGE}.jar
echo.
echo adb push %%FILE%% %%APK_DIR%% || exit /b 1
echo adb shell chmod 444 %%APK_DIR%%/%%FILE%%
echo pause
) > upload.bat
"""
            }
        } else {
            exec {
                workingDir "${buildDir}/libs/"
                commandLine 'sh', '-c', "${projectDir}/../dx/d8 --output ${MY_SOURCES_PACKAGE}.jar CustomSources-1.0-SNAPSHOT.jar"
            }
            exec {
                workingDir "${buildDir}/libs/"
                commandLine 'sh', '-c', """
cat > upload.sh <<'EOF'
#!/bin/bash

APK_DIR="/sdcard/Android/data/com.github.eprendre.tingshu/files/jars"
FILE="${MY_SOURCES_PACKAGE}.jar"

adb push "\$FILE" "\$APK_DIR/" || exit 1
adb shell chmod 444 "\$APK_DIR/\$FILE"
EOF
"""
            }
        }
    }
}

jar.finalizedBy(dexTask)